[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-eval-sdk"
version = "0.1.0"
description = "Zero-latency LLM observability and evaluation SDK"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "LLM Eval" }]
keywords = ["llm", "evaluation", "observability", "ragas", "mlops"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.40"]

[project.urls]
Homepage = "https://github.com/yourusername/llm-eval"
Repository = "https://github.com/yourusername/llm-eval"

[tool.hatch.build.targets.wheel]
packages = ["llm_eval"]
